<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Inmobiliaria Rodríguez</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="header">
    <div class="container header-container">
        <h2>🏢 Martínez & Asociados</h2>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="historia.html">Historia</a></li>
                <li><a href="propiedades.html">Propiedades</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="section">
    <div class="container">
        <h1 class="section-title">Contacta con Nosotros</h1>

        <form class="contact-form">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

            <button type="submit" class="btn-primary">Enviar Mensaje</button>
        </form>

        <div class="contact-info">
            <h3>Información de Contacto</h3>
            <p>📍 Av. Principal #123, Ciudad Inmobiliaria</p>
            <p>📞 +1 (809) 973-0827</p>
            <p>✉ info@martínezinmobiliaria.com</p>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="footer-bottom">
        <p>© 2026 Inmobiliaria Martínez & Asociados</p>
    </div>
</footer>

</body>
</html>
